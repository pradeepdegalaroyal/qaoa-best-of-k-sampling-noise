[project]
name = "qaoa-bok"
version = "0.1.0"
description = "Best-of-K sampling QAOA under gate noise vs random and local-search baselines"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "networkx"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
